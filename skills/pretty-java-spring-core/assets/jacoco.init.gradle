allprojects {
    pluginManager.withPlugin('java') {
        apply plugin: 'jacoco'

        tasks.withType(Test).configureEach {
            finalizedBy tasks.named('jacocoTestReport')
        }

        tasks.named('jacocoTestReport') {
            reports {
                xml.required = true
                html.required = false
                csv.required = false
            }
        }
    }
}
